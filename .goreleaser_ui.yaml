version: 2
env:
  - SKIP_PUBLISH={{ if index .Env "SKIP_PUBLISH" }}{{ .Env.SKIP_PUBLISH }}{{ else }}true{{ end }}
project_name: netibird-awg-ui

before:
  hooks:
    # Bindings are gitignored; regenerate before the frontend build so
    # the @wailsio/runtime Vite plugin can resolve them (vite refuses to
    # build without them).
    - sh -c 'cd client/ui && wails3 generate bindings -clean=true -ts'
    - sh -c 'cd client/ui/frontend && pnpm install --frozen-lockfile && pnpm build'

builds:
  - id: netibird-awg-ui
    dir: client/ui
    binary: netibird-awg-ui
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - production

  - id: netibird-awg-ui-windows-amd64
    dir: client/ui
    binary: netibird-awg-ui
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
      - -H windowsgui
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - production

  - id: netibird-awg-ui-windows-arm64
    dir: client/ui
    binary: netibird-awg-ui
    env:
      - CGO_ENABLED=1
      - CC=aarch64-w64-mingw32-clang
      - CXX=aarch64-w64-mingw32-clang++
    goos:
      - windows
    goarch:
      - arm64
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
      - -H windowsgui
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - production

archives:
  - id: linux-arch
    name_template: "{{ .ProjectName }}-linux_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - netibird-awg-ui
  - id: windows-arch
    name_template: "{{ .ProjectName }}-windows_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - netibird-awg-ui-windows-amd64
      - netibird-awg-ui-windows-arm64

nfpms:
  - maintainer: Netibird-AWG <dev@netbird.io>
    description: Netibird-AWG client UI.
    homepage: https://netbird.io/
    license: BSD-3-Clause
    vendor: Netibird-AWG
    id: netibird_awg_ui_deb
    package_name: netibird-awg-ui
    builds:
      - netibird-awg-ui
    formats:
      - deb
    replaces:
      - netbird-ui
    conflicts:
      - netbird-ui
    provides:
      - netbird-ui
    scripts:
      postinstall: "release_files/ui-post-install.sh"
    contents:
      - src: client/ui/build/linux/netbird.desktop
        dst: /usr/share/applications/org.wails.netbird.desktop
      - src: client/ui/build/appicon.png
        dst: /usr/share/pixmaps/netbird.png
    dependencies:
      - netibird-awg (>= 0.75.0)
      - libgtk-4-1 (>= 4.14)
      - libwebkitgtk-6.0-4

  - maintainer: Netibird-AWG <dev@netbird.io>
    description: Netibird-AWG client UI.
    homepage: https://netbird.io/
    license: BSD-3-Clause
    vendor: Netibird-AWG
    id: netibird_awg_ui_rpm
    package_name: netibird-awg-ui
    builds:
      - netibird-awg-ui
    formats:
      - rpm
    replaces:
      - netbird-ui
    conflicts:
      - netbird-ui
    provides:
      - netbird-ui
    scripts:
      postinstall: "release_files/ui-post-install.sh"
    contents:
      - src: client/ui/build/linux/netbird.desktop
        dst: /usr/share/applications/org.wails.netbird.desktop
      - src: client/ui/build/appicon.png
        dst: /usr/share/pixmaps/netbird.png
    dependencies:
      - netibird-awg >= 0.75.0
      - (gtk4 >= 4.14 or libgtk-4-1 >= 4.14)
      - (webkitgtk6.0 or libwebkitgtk-6_0-4)

    rpm:
      signature:
        key_file: '{{ if index .Env "GPG_RPM_KEY_FILE" }}{{ .Env.GPG_RPM_KEY_FILE }}{{ end }}'

uploads:
  - name: debian
    skip: "{{ .Env.SKIP_PUBLISH }}"
    ids:
      - netibird_awg_ui_deb
    mode: archive
    target: https://pkgs.wiretrustee.com/debian/pool/{{ .ArtifactName }};deb.distribution=stable;deb.component=main;deb.architecture={{ if .Arm }}armhf{{ else }}{{ .Arch }}{{ end }};deb.package=
    username: dev@wiretrustee.com
    method: PUT

  - name: yum
    skip: "{{ .Env.SKIP_PUBLISH }}"
    ids:
      - netibird_awg_ui_rpm
    mode: archive
    target: https://pkgs.wiretrustee.com/yum/{{ .Arch }}{{ if .Arm }}{{ .Arm }}{{ end }}
    username: dev@wiretrustee.com
    method: PUT
